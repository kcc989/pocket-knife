name: Publish

# Publishes the package to npm when a GitHub release is published. npm trusts this workflow by its file name, over
# OIDC (trusted publishing), so no npm token is stored, and npm adds provenance to the package.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check that the release's tag is the package's version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install an npm that publishes with trusted publishing (11.5.1 or newer)
        run: npm install -g npm@12.2.1
      - run: npm publish --provenance --access public
